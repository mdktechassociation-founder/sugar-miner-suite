// Root Gradle build. Flutter's tooling checks for this file to know the project
// is a Gradle project at all — without it you get the confusing
// "use of deleted Android v1 embedding" error.
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
