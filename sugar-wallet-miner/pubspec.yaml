name: sugar_wallet_miner
description: Every user gets their own Sugarchain wallet, and their phone mines SUGAR into it. Consented, always-visible, self-custody mining built on sugar-miner-sdk.
publish_to: 'none'
version: 1.0.0+1
repository: https://github.com/mdktechassociation-founder/sugar-wallet-miner

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The mining engine: service, notification, boot receiver, policy limits.
  # Pinned to a tag, not main: the engine inside a released APK must be the one
  # that was tested, and a `main` dependency would change it silently on the next
  # pub get. Bumping this is a deliberate act, with the CHANGELOG read first.
  sugar_miner_sdk:
    git:
      url: https://github.com/mdktechassociation-founder/sugar-miner-sdk.git
      ref: v2.0.0
  # The wallet: pure Dart, no dependencies, tested against BIP-173 vectors.
  sugar_wallet:
    path: packages/sugar_wallet
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
