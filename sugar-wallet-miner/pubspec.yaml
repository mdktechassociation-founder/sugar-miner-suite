name: sugar_wallet_miner
description: Every user gets their own Sugarchain wallet, and their phone mines SUGAR into it. Consented, always-visible, self-custody mining built on sugar-miner-sdk.
publish_to: 'none'
version: 1.0.0+1
repository: https://github.com/mdktechassociation-founder/sugar-miner-suite

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The mining engine: service, notification, boot receiver, policy limits.
  # Inside the suite this is a path dependency: the engine and the apps that embed
  # it live in one repository now, so the pin is the commit itself and there is
  # nothing left to drift. CI builds the engine and this app from the same tree.
  #
  # A project *outside* the suite pins the engine by tag instead — same engine,
  # same subfolder, fetched from this repository:
  #   sugar_miner_sdk:
  #     git:
  #       url: https://github.com/mdktechassociation-founder/sugar-miner-suite.git
  #       ref: sdk-v2.0.0
  #       path: sugar-miner-sdk
  sugar_miner_sdk:
    path: ../sugar-miner-sdk
  # The wallet: pure Dart, no dependencies, tested against BIP-173 vectors.
  sugar_wallet:
    path: packages/sugar_wallet
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
