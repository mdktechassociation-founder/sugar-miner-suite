name: miner app — the owner's own miner

on:
  push:
    branches: [main]
    paths: ['sugar-miner-app/**', '.github/workflows/miner-app.yml']
  pull_request:
    paths: ['sugar-miner-app/**', '.github/workflows/miner-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miner-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: native hashing core self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-miner-app
    steps:
      - uses: actions/checkout@v7
      - name: Build the C library and check the genesis PoW hash
        run: python3 tools/selftest.py

  apk:
    name: build release APKs
    runs-on: ubuntu-latest
    needs: native-core
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sugar-miner-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: |
          flutter --version
          java -version
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos || true
      - name: Build (per ABI, so each APK is small)
        run: flutter build apk --release --split-per-abi
      - name: List what was built
        run: ls -la build/app/outputs/flutter-apk/ || true
      - uses: actions/upload-artifact@v7
        with:
          name: sugar-miner-apk
          path: sugar-miner-app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  apk-universal:
    name: build universal APK
    runs-on: ubuntu-latest
    needs: native-core
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sugar-miner-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: sugar-miner-apk-universal
          path: sugar-miner-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
