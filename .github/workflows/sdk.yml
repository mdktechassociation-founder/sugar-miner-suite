name: sdk — the mining engine

# One workflow per component, each triggered only by its own files. A change to
# the engine cannot silently break the wallet app: the wallet job builds the
# engine from this same tree, and both run on every push that touches either.
on:
  push:
    branches: [main]
    paths: ['sugar-miner-sdk/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['sugar-miner-sdk/**', '.github/workflows/sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The promise in the README, enforced by a test.
  guardrails:
    name: consented-and-visible guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-miner-sdk
    steps:
      - uses: actions/checkout@v7
      - name: Every code path must be consented, visible and limited
        run: python3 tools/guardrails.py

  # The engine's own promise, tested rather than reviewed: rig mode splits the
  # consented budget and can never enlarge it.
  engine-tests:
    name: engine unit tests (the budget stays a ceiling)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-miner-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Every core plan, every device state
        run: flutter test

  # The hashing core must reproduce the coin's genesis proof-of-work hash.
  native-core:
    name: native core self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-miner-sdk
    steps:
      - uses: actions/checkout@v7
      - name: Build the C library and check the SugarChain genesis hash
        run: python3 tools/selftest.py
      - name: Configure and build the plugin's CMake project
        run: |
          cmake -S android/src/main/cpp -B /tmp/cmake-check -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/cmake-check
          nm -D /tmp/cmake-check/libyespower.so | grep -E 'yp_hash|yp_scan|yp_version|yp_free_local'

  # Cross-compiles for every ABI the plugin ships, so a broken toolchain or a
  # missing source file is caught before a full APK build.
  cross-compile:
    name: native core (cross)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64-v8a,   cc: aarch64-linux-gnu-gcc,   pkg: gcc-aarch64-linux-gnu }
          - { name: armeabi-v7a, cc: arm-linux-gnueabihf-gcc, pkg: gcc-arm-linux-gnueabihf }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.pkg }}
      - name: Compile for ${{ matrix.name }}
        working-directory: sugar-miner-sdk/native/yespower
        run: |
          ${{ matrix.cc }} -O3 -fPIC -shared -o /tmp/libyespower-${{ matrix.name }}.so \
              yp_bridge.c yespower-opt.c sha256.c -I.
          file /tmp/libyespower-${{ matrix.name }}.so
      - name: The symbols Dart looks up must survive the linker
        run: |
          readelf --dyn-syms /tmp/libyespower-${{ matrix.name }}.so \
            | grep -E 'yp_hash|yp_scan|yp_version|yp_free_local'

  # Proof that an ordinary app can integrate this in a few lines.
  example-apk:
    name: build the example app
    runs-on: ubuntu-latest
    needs: [guardrails, engine-tests, native-core, cross-compile]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versions
        run: flutter --version
      - name: Resolve dependencies (plugin + example)
        working-directory: sugar-miner-sdk/example
        run: flutter pub get
      - name: Analyze
        working-directory: sugar-miner-sdk
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          cd example && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build the example APK
        working-directory: sugar-miner-sdk/example
        run: flutter build apk --release
      - name: Confirm the restart machinery shipped inside the APK
        run: |
          APK=sugar-miner-sdk/example/build/app/outputs/flutter-apk/app-release.apk
          unzip -o -q "$APK" AndroidManifest.xml -d /tmp/manifestcheck
          strings -e l /tmp/manifestcheck/AndroidManifest.xml \
            | grep -E 'RECEIVE_BOOT_COMPLETED|SugarBootReceiver|BOOT_COMPLETED|SugarMiningService|PROPERTY_SPECIAL_USE' | sort -u
          strings -e l /tmp/manifestcheck/AndroidManifest.xml | grep -q 'SugarBootReceiver'
          strings -e l /tmp/manifestcheck/AndroidManifest.xml | grep -q 'RECEIVE_BOOT_COMPLETED'
      - name: Confirm the hashing library actually shipped inside the APK
        run: |
          APK=sugar-miner-sdk/example/build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'libyespower\.so'
          unzip -o -q "$APK" 'lib/arm64-v8a/libyespower.so' -d /tmp/apkcheck
          readelf --dyn-syms /tmp/apkcheck/lib/arm64-v8a/libyespower.so | grep -E 'yp_hash|yp_scan|yp_version'
      - uses: actions/upload-artifact@v7
        with:
          name: sugar-miner-sdk-example-apk
          path: sugar-miner-sdk/example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
