name: build apk

# Builds the Android app in the cloud — no Flutter install needed locally.
# Every push produces downloadable APKs under Actions -> run -> Artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'native/**'
      - 'pubspec.yaml'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: native hashing core self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the C library and check the genesis PoW hash
        run: python3 tools/selftest.py

  apk:
    name: build release APKs
    runs-on: ubuntu-latest
    needs: native-core
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Build (per ABI, so each APK is small)
        run: flutter build apk --release --split-per-abi

      - name: List what was built
        run: ls -la build/app/outputs/flutter-apk/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: sugar-miner-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  # One universal APK as well, for phones where you are not sure of the ABI.
  apk-universal:
    name: build universal APK
    runs-on: ubuntu-latest
    needs: native-core
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sugar-miner-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
