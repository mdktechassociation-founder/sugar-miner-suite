name: platform — wallet creator, wrap service, fleet console

on:
  push:
    branches: [main]
    paths: ['minehub/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['minehub/**', '.github/workflows/platform.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet:
    name: wallet math (vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minehub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Proves the address generation with published vectors, not with values this
      # code produced: SHA/RIPEMD standard vectors and BIP-173.
      - run: node test_wallet.js

  platform:
    name: wrap engine + http surface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minehub
    steps:
      - uses: actions/checkout@v7
      - name: Build the single-file console
        run: python3 build.py
      - name: Check the built page is self-contained
        run: |
          python3 - <<'EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          external = re.findall(r'(?:src|href)="(https?://[^"]+)"', html)
          assert not external, f'index.html must not depend on the network: {external}'
          assert 'SugarWallet' in html and 'MineHub' in html
          print(f'index.html is self-contained ({len(html)/1024:.1f} KB)')
          EOF
      - name: Run the end-to-end tests
        run: python3 test_server.py

  clean-mode:
    name: clean mode really does leave the app alone
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minehub
    steps:
      - uses: actions/checkout@v7
      - name: Wrap a fixture project and diff it
        run: python3 test_server.py

  no-stealth:
    name: no stealth, no key custody, no repackaging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minehub
    steps:
      - uses: actions/checkout@v7
      - name: The platform's three refusals must stay in the code
        run: |
          python3 - <<'EOF'
          import pathlib, sys, re
          server = pathlib.Path('server.py').read_text(encoding='utf-8')
          server += pathlib.Path('wrapper.py').read_text(encoding='utf-8')
          console = pathlib.Path('src/console_app.js').read_text(encoding='utf-8')
          template = pathlib.Path('src/index.template.html').read_text(encoding='utf-8')
          wallet = pathlib.Path('src/sugar_wallet.js').read_text(encoding='utf-8')

          failures = []
          if 'compiled-apk' not in server or 're-signing' not in server:
              failures.append('the APK refusal path is gone')
          blob = (server + console + wallet).lower()
          for allowed in ['no stealth', 'no hidden', 'not hidden', 'no quiet']:
              blob = blob.replace(allowed, ' ')
          for word in ['hidenotification', 'silentmode', 'nonotification',
                       'hiddennotification', 'stealth', 'coinhive']:
              if word in blob:
                  failures.append(f'{word} appeared in the platform')
          for field in ["'wif'", '"wif"', 'privateKey', 'seedPhrase', 'mnemonic']:
              if field in server:
                  failures.append(f'server.py touches {field}')
          if 'getRandomValues' not in wallet:
              failures.append('the wallet does not use crypto.getRandomValues')
          if 'Math.random' in wallet:
              failures.append('Math.random in key generation')
          if 'no stealth' not in template.lower():
              failures.append('the honesty panel left the console')

          for f in failures:
              print(f'  x {f}')
          if failures:
              print('\nMineHub will not trade these away: consented mining, client-side')
              print('keys, and no repackaging of other people\'s binaries.')
              sys.exit(1)
          print('all refusals intact')
          EOF
