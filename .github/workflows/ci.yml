name: sugar wallet checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wallet-vectors:
    name: wallet vectors (BIP-173 + cross-implementation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # No package dependencies to resolve: the wallet package has none, on purpose.
      - name: Run the vectors
        run: dart run packages/sugar_wallet/test/wallet_vectors.dart

  qr-symbol:
    name: the QR code is correct, and a real scanner reads it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The two independent implementations the encoder is checked against.
      - name: Install the reference encoder and a decoder
        run: pip install qrcode opencv-python-headless numpy
      # Three questions per test string: does it agree with a second encoder at a
      # pinned mask, is the version/size right, and can OpenCV read it back exactly.
      # A QR that looks right but does not scan is the failure this catches.
      - name: Check the symbol
        run: python3 tools/check_qr.py

  guardrails:
    name: the wallet is the user's, the mining is visible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the promises this app makes on its own screens
        run: python3 tools/guardrails.py

  app:
    name: analyze and build the APK
    needs: [wallet-vectors, guardrails, qr-symbol]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Unit and widget tests: the price/hashrate history rules, the receive
      # screen, and the encoder's own edge cases.
      - name: Test
        run: flutter test

      - name: Build the release APK
        run: flutter build apk --release

      - name: Confirm the SDK's mining machinery merged into the manifest
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          for entry in SugarMiningService SugarBootReceiver RECEIVE_BOOT_COMPLETED \
                       POST_NOTIFICATIONS PROPERTY_SPECIAL_USE_FGS_SUBTYPE \
                       FOREGROUND_SERVICE_SPECIAL_USE; do
            if strings -e l /tmp/manifest.bin | grep -q "$entry"; then
              echo "  ok  $entry"
            else
              echo "  MISSING  $entry"; exit 1
            fi
          done
          echo "the miner, its notification and its reboot receiver are in the APK"

      - uses: actions/upload-artifact@v7
        with:
          name: sugar-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
