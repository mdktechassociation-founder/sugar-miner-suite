name: wallet app — the user's own wallet, mining for them

on:
  push:
    branches: [main]
    paths: ['sugar-wallet-miner/**', 'sugar-miner-sdk/**', '.github/workflows/wallet-app.yml']
  pull_request:
    paths: ['sugar-wallet-miner/**', 'sugar-miner-sdk/**', '.github/workflows/wallet-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-vectors:
    name: wallet vectors (BIP-173 + cross-implementation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-wallet-miner
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # No package dependencies to resolve: the wallet package has none, on purpose.
      - name: Run the vectors
        run: dart run packages/sugar_wallet/test/wallet_vectors.dart
      # SHA-512, HMAC, BIP-39, BIP-32 and the Sugarchain phrase→address composition.
      # Consuming wallets will restore from these words; a mistake here is a wallet
      # that opens somewhere else and is empty.
      - name: Run the phrase vectors
        run: dart run packages/sugar_wallet/test/hd_vectors.dart

  qr-symbol:
    name: the QR code is correct, and a real scanner reads it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-wallet-miner
    steps:
      - uses: actions/checkout@v7
      # Flutter's own dart, not a standalone one: tool/qr_dump.dart reaches the
      # encoder through the app's package, and that package needs the Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install the reference encoder and a decoder
        run: pip install qrcode opencv-python-headless numpy
      - name: Check the symbol
        run: python3 tools/check_qr.py

  guardrails:
    name: the wallet is the user's, the mining is visible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sugar-wallet-miner
    steps:
      - uses: actions/checkout@v7
      - name: Check the promises this app makes on its own screens
        run: python3 tools/guardrails.py

  app:
    name: analyze, test and build the APK
    needs: [wallet-vectors, guardrails, qr-symbol]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sugar-wallet-miner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build the release APK
        run: flutter build apk --release
      - name: Confirm the SDK's mining machinery merged into the manifest
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          unzip -p "$APK" AndroidManifest.xml > /tmp/manifest.bin
          for entry in SugarMiningService SugarBootReceiver RECEIVE_BOOT_COMPLETED \
                       POST_NOTIFICATIONS PROPERTY_SPECIAL_USE_FGS_SUBTYPE \
                       FOREGROUND_SERVICE_SPECIAL_USE; do
            if strings -e l /tmp/manifest.bin | grep -q "$entry"; then
              echo "  ok  $entry"
            else
              echo "  MISSING  $entry"; exit 1
            fi
          done
          echo "the miner, its notification and its reboot receiver are in the APK"
      - uses: actions/upload-artifact@v7
        with:
          name: sugar-wallet-apk
          path: sugar-wallet-miner/build/app/outputs/flutter-apk/app-release.apk
