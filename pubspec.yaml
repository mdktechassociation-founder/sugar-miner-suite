name: sugar_miner_sdk
description: Consented background SUGAR (yespowerSUGAR) mining for Flutter apps — native C hashing via FFI, direct Stratum, always-visible notification, hard policy limits.
version: 1.0.0
repository: https://github.com/mdktechassociation-founder/sugar-miner-sdk
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mdk.sugarminer.sdk
        pluginClass: SugarMinerPlugin
